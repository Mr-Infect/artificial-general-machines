experiment:
  name: v02_exp2_src_B
  description: 'Exp 2 source run in domain B: AGM v0.2 in exploration mode (evaluates
    up to 8 candidates per step regardless of early target) writes patterns and principles.'
  tags:
  - v02_exp2_src
  seed: 3120
  repeats: 1
  task:
    type: scientific_verification
    domain: scientific
    dataset_size: 2000
    noise: 0.1
    anomaly_rate: 0.03
    verification_required: true
    priority: 1
  environment:
    cpu: 1
    memory_mb: 512
    latency_ms: 2000
    network: true
    available_capabilities: all
  objective:
    quality_threshold: 0.0
    top_fraction: 0.1
  budget:
    max_seconds: 120
    max_cost: 0.25
    step_timeout_s: 30
  schedule:
    steps: 5
    step_seconds: 10
    validation_fraction: 0.2
  events:
  - t: 10
    type: memory_reduction
    params:
      memory_mb: 80
  - t: 20
    type: network_loss
  - t: 20
    type: capability_removal
    params:
      capabilities:
      - model:large_reasoner
      - tool:search
      - component:lookahead_planner
  - t: 30
    type: latency_reduction
    params:
      latency_ms: 800
  - t: 40
    type: priority_increase
    params:
      priority: 3
  agents:
  - name: agm_v2_src
    type: agm_v2
    max_evaluations: 8
    memory_mode: full
    economics_mode: economic
    explore_all: true
    memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v02/memory/exp2_src_B_20.sqlite
    principle_memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v02/memory/exp2_src_B_20.sqlite
