experiment:
  name: v02_exp1_B
  description: 'Exp 1 repeatability: Domain B with AGM v0.1 and v0.2, cold vs memory
    from Domain A (paired by seed).'
  tags:
  - v02_exp1
  seed: 2023
  repeats: 1
  task:
    type: scientific_verification
    domain: scientific
    dataset_size: 2000
    noise: 0.1
    anomaly_rate: 0.03
    verification_required: true
    priority: 1
  environment:
    cpu: 1
    memory_mb: 512
    latency_ms: 2000
    network: true
    available_capabilities: all
  objective:
    quality_threshold: 0.0
    top_fraction: 0.1
  budget:
    max_seconds: 120
    max_cost: 0.25
    step_timeout_s: 30
  schedule:
    steps: 5
    step_seconds: 10
    validation_fraction: 0.2
  events:
  - t: 10
    type: memory_reduction
    params:
      memory_mb: 80
  - t: 20
    type: network_loss
  - t: 20
    type: capability_removal
    params:
      capabilities:
      - model:large_reasoner
      - tool:search
      - component:lookahead_planner
  - t: 30
    type: latency_reduction
    params:
      latency_ms: 800
  - t: 40
    type: priority_increase
    params:
      priority: 3
  agents:
  - name: fixed
    type: fixed
    architecture:
      perception:
        mode: parallel
        components:
        - statistical_detector
        - anomaly_detector
        - rate_detector
      reasoning:
        type: parallel
        model: small_reasoner
        threshold: 0.5
      verification:
        type: rule_based
  - name: adaptive
    type: adaptive
  - name: search
    type: search
    max_evaluations: 8
  - name: self_evolving
    type: self_evolving
    mutations_per_step: 2
  - name: agm_v1_cold
    type: agm
    max_evaluations: 6
  - name: agm_v1_memory
    type: agm
    max_evaluations: 6
    memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v02/memory/exp1_v1_A_23.sqlite
  - name: agm_v2_cold
    type: agm_v2
    max_evaluations: 6
    memory_mode: none
    economics_mode: economic
    explore_all: false
  - name: agm_v2_memory
    type: agm_v2
    max_evaluations: 6
    memory_mode: full
    economics_mode: economic
    explore_all: false
    memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v02/memory/exp1_v2_A_23.sqlite
    principle_memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v02/memory/exp1_v2_A_23.sqlite
