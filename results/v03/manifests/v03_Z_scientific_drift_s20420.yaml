experiment:
  name: v03_Z_scientific_drift
  description: v0.3 false-analogy environment scientific_drift with held-out regime
    combinations; all agents, memory from the training runs of the same seed.
  tags:
  - v03_Z
  seed: 20420
  repeats: 1
  task:
    type: scientific_verification
    domain: scientific_drift
    dataset_size: 3000
    noise: 0.1
    anomaly_rate: 0.03
    verification_required: true
    priority: 1
  environment:
    cpu: 1
    memory_mb: 512
    latency_ms: 2000
    network: false
    available_capabilities: all
  objective:
    quality_threshold: 0.0
  budget:
    max_seconds: 600
    max_cost: 1.0
    step_timeout_s: 30
  schedule:
    steps: 9
    step_seconds: 10
    validation_fraction: 0.2
    validation_mode: recent
  regime:
    set: heldout
    oracle_points: 48
  events: []
  agents:
  - name: fixed
    type: fixed
    architecture:
      perception:
        mode: parallel
        components:
        - statistical_detector
        - anomaly_detector
        - rate_detector
      reasoning:
        type: parallel
        model: small_reasoner
        threshold: 0.5
      verification:
        type: rule_based
  - name: adaptive
    type: adaptive
    library: roles
  - name: search
    type: search
    space: auto
    max_evaluations: 6
  - name: task_memory
    type: agm_v2
    max_evaluations: 6
    memory_mode: task
    memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_task.sqlite
    principle_memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_task.sqlite
  - name: architecture_memory
    type: agm_v2
    max_evaluations: 6
    memory_mode: architecture
    memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_arch.sqlite
    principle_memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_arch.sqlite
  - name: always_adapt
    type: agm_v3
    max_evaluations: 6
    explore_all: false
    economics_mode: always_adapt
  - name: never_adapt
    type: agm_v3
    max_evaluations: 6
    explore_all: false
    economics_mode: never_adapt
  - name: agm_cold
    type: agm_v3
    max_evaluations: 6
    explore_all: false
  - name: agm_full
    type: agm_v3
    max_evaluations: 6
    explore_all: false
    memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_full.sqlite
    principle_memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_full.sqlite
  - name: agm_no_principle
    type: agm_v3
    max_evaluations: 6
    explore_all: false
    use_principles: false
    memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_no_principle.sqlite
    principle_memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_no_principle.sqlite
  - name: agm_no_archmem
    type: agm_v3
    max_evaluations: 6
    explore_all: false
    use_archmem: false
    memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_no_archmem.sqlite
    principle_memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_no_archmem.sqlite
  - name: agm_no_negative
    type: agm_v3
    max_evaluations: 6
    explore_all: false
    use_negative: false
    memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_no_negative.sqlite
    principle_memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_no_negative.sqlite
  - name: agm_no_economics
    type: agm_v3
    max_evaluations: 6
    explore_all: false
    economics_mode: always_adapt
    memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_no_economics.sqlite
    principle_memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_no_economics.sqlite
  - name: agm_no_regime
    type: agm_v3
    max_evaluations: 6
    explore_all: false
    regime_detection: false
    memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_no_regime.sqlite
    principle_memory:
      read: true
      write: true
      db: /home/cool/AGM-Laboratory/results/v03/memory/scientific_drift_20_no_regime.sqlite
