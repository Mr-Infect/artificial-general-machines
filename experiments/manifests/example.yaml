# Minimal example (Section 14). Run with:
#   python -m experiments.run experiments/manifests/example.yaml
experiment:
  name: example_dynamic_network
  description: Five-step network anomaly stream with the Section 12 event schedule.
  seed: 42
  repeats: 1
  task:
    type: anomaly_detection
    domain: network
    dataset_size: 2000
    noise: 0.05
    anomaly_rate: 0.03
    verification_required: false
    priority: 1
  environment:
    cpu: 1
    memory_mb: 512
    latency_ms: 2000
    network: true
    available_capabilities: all
  objective:
    quality_threshold: 0.85
  budget:
    max_seconds: 120
    max_cost: 0.25
    step_timeout_s: 30
  schedule:
    steps: 5
    step_seconds: 10
    validation_fraction: 0.2
  events:
    - {t: 10, type: memory_reduction, params: {memory_mb: 120}}
    - {t: 20, type: network_loss}
    - {t: 20, type: capability_removal, params: {capabilities: [model:large_reasoner, tool:search]}}
    - {t: 30, type: latency_reduction, params: {latency_ms: 800}}
    - {t: 40, type: priority_increase, params: {priority: 3}}
  agents:
    - {name: fixed, type: fixed}
    - {name: adaptive, type: adaptive}
    - {name: search, type: search, max_evaluations: 8}
    - {name: self_evolving, type: self_evolving, mutations_per_step: 2}
    - {name: agm_cold, type: agm, max_evaluations: 6, memory: {read: false, write: true, db: results/memory/example.sqlite}}
