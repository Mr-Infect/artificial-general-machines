# Domain C: resource-constrained planning (v0.2). Same event schedule as A and B.
experiment:
  name: v02_domain_c_planning
  description: Domain C planning run for the transfer matrix.
  tags: [v02_domain_c]
  seed: 300
  repeats: 3
  task: {type: resource_planning, domain: planning, dataset_size: 2000, noise: 0.1, anomaly_rate: 0.03, verification_required: false, priority: 1}
  environment: {cpu: 1, memory_mb: 512, latency_ms: 2000, network: true, available_capabilities: all}
  objective: {quality_threshold: 0.75}
  budget: {max_seconds: 120, max_cost: 0.25, step_timeout_s: 30}
  schedule: {steps: 5, step_seconds: 10, validation_fraction: 0.2}
  events:
    - {t: 10, type: memory_reduction, params: {memory_mb: 80}}
    - {t: 20, type: network_loss}
    - {t: 20, type: capability_removal, params: {capabilities: [model:large_reasoner, tool:search, component:lookahead_planner]}}
    - {t: 30, type: latency_reduction, params: {latency_ms: 800}}
    - {t: 40, type: priority_increase, params: {priority: 3}}
  agents:
    - {name: fixed, type: fixed, architecture: {perception: {mode: parallel, components: [priority_filter, risk_estimator, feasibility_checker], window: 20}, reasoning: {type: parallel, model: small_reasoner, threshold: 0.5}, verification: {type: rule_based}}}
    - {name: adaptive, type: adaptive}
    - {name: search, type: search, max_evaluations: 8}
    - {name: agm_cold, type: agm, max_evaluations: 6, memory: {read: false, write: true}}
