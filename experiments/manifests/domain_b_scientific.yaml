# Domain B: synthetic scientific-data verification (Section 16).
# agm_cold starts with no memory; agm_memory reads what Domain A wrote (via the suite's shared memory_db).
experiment:
  name: cross_domain_001_domain_b_scientific
  description: Domain B transfer test. Compares AGM cold start vs AGM with Domain A structural memory against baselines.
  tags: [cross_domain_001]
  seed: 200
  repeats: 3
  task: {type: scientific_verification, domain: scientific, dataset_size: 2000, noise: 0.1, anomaly_rate: 0.03, verification_required: true, priority: 1}
  environment: {cpu: 1, memory_mb: 512, latency_ms: 2000, network: true, available_capabilities: all}
  objective: {quality_threshold: 0.80}
  budget: {max_seconds: 120, max_cost: 0.25, step_timeout_s: 30}
  schedule: {steps: 5, step_seconds: 10, validation_fraction: 0.2}
  events:
    - {t: 10, type: memory_reduction, params: {memory_mb: 120}}
    - {t: 20, type: network_loss}
    - {t: 20, type: capability_removal, params: {capabilities: [model:large_reasoner, tool:search]}}
    - {t: 30, type: latency_reduction, params: {latency_ms: 800}}
    - {t: 40, type: priority_increase, params: {priority: 3}}
  agents:
    - {name: fixed, type: fixed}
    - {name: adaptive, type: adaptive}
    - {name: search, type: search, max_evaluations: 8}
    - {name: agm_cold, type: agm, max_evaluations: 6, memory: {read: false, write: false}}
    - {name: agm_memory, type: agm, max_evaluations: 6, memory: {read: true, write: true}}
